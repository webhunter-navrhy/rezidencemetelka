{# Kontaktní formulář. Endpoint a demo režim z _data/site.json (formular.endpoint, formular.demo). #}
<form class="formular" method="post" {% if site.formular.endpoint and not site.formular.demo %}action="{{ site.formular.endpoint }}"{% endif %} data-endpoint="{{ site.formular.endpoint }}" data-demo="{{ 1 if site.formular.demo or not site.formular.endpoint else 0 }}">
  <label class="pole"><span>Jméno a příjmení</span><input name="jmeno" autocomplete="name" required></label>
  <div class="pole-radek">
    <label class="pole"><span>E-mail</span><input name="email" type="email" autocomplete="email" required></label>
    <label class="pole"><span>Telefon</span><input name="telefon" type="tel" autocomplete="tel"></label>
  </div>
  <label class="pole"><span>Byt, o který máte zájem</span><input name="byt" data-pole-byt placeholder="např. K Metelce I, byt 3"></label>
  <label class="pole"><span>Zpráva</span><textarea name="zprava" rows="4" required>Dobrý den, mám zájem o prohlídku a podrobnější informace.</textarea></label>
  <div class="past" aria-hidden="true"><label>Nevyplňovat <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
  <input type="hidden" name="_subject" value="{{ site.formular.predmet }}">
  <button type="submit" class="btn">Odeslat poptávku</button>
  <p class="formular-stav" role="status" aria-live="polite"></p>
</form>
